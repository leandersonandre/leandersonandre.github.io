{{- $aulas := site.Data.aulas -}}

<div class="minhas-aulas">

  <div class="minhas-aulas-tabs">
    <button
      type="button"
      class="minhas-aulas-tab active"
      data-tab="hoje">
      Hoje
    </button>

    <button
      type="button"
      class="minhas-aulas-tab"
      data-tab="semana">
      Semana
    </button>
  </div>

  <div
    id="minhas-aulas-hoje"
    class="minhas-aulas-content active">
  </div>

  <div
    id="minhas-aulas-semana"
    class="minhas-aulas-content">
  </div>

  <script>
    (() => {
      const aulas = {{ $aulas | jsonify | safeJS }};

      const dias = [
        "domingo",
        "segunda",
        "terca",
        "quarta",
        "quinta",
        "sexta",
        "sabado"
      ];

      const nomesDias = [
        "Domingo",
        "Segunda-feira",
        "Terça-feira",
        "Quarta-feira",
        "Quinta-feira",
        "Sexta-feira",
        "Sábado"
      ];

      const hoje = new Date();
      const numeroDia = hoje.getDay();
      const diaAtual = dias[numeroDia];

      const hojeElement =
        document.getElementById("minhas-aulas-hoje");

      const semanaElement =
        document.getElementById("minhas-aulas-semana");

      function escapeHtml(valor) {
        if (valor === undefined || valor === null) {
          return "";
        }

        return String(valor)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function criarAulas(lista) {

        if (!lista || lista.length === 0) {
          return `
            <div class="minhas-aulas-vazio">
              Nenhuma aula.
            </div>
          `;
        }

        return `
          <div class="minhas-aulas-lista">

            ${lista.map(aula => `
              <div class="minha-aula">

                <div class="minha-aula-horario">
                  ${escapeHtml(aula.horario)}
                </div>

                <div class="minha-aula-info">

                  <div class="minha-aula-disciplina">
                    ${escapeHtml(aula.disciplina)}
                  </div>

                  <div class="minha-aula-sala">
                    ${escapeHtml(aula.sala)}
                  </div>

                  ${
                    aula.observacao
                    ? `
                      <div class="minha-aula-observacao">
                        ${escapeHtml(aula.observacao)}
                      </div>
                    `
                    : ""
                  }

                </div>

              </div>
            `).join("")}

          </div>
        `;
      }

      function criarDia(nome, chave) {

        const lista = aulas[chave] || [];

        return `
          <section class="minhas-aulas-dia">

            <h3 class="minhas-aulas-dia-titulo">
              ${nome}
            </h3>

            ${criarAulas(lista)}

          </section>
        `;
      }

      /*
       * ABA HOJE
       */

      hojeElement.innerHTML = `
        <div class="minhas-aulas-cabecalho">

          <div class="minhas-aulas-data">
            ${nomesDias[numeroDia]}
          </div>

          <div class="minhas-aulas-data-completa">
            ${hoje.toLocaleDateString("pt-BR", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric"
            })}
          </div>

        </div>

        ${criarAulas(aulas[diaAtual])}
      `;


      /*
       * ABA SEMANA
       */

      let semanaHtml = "";

      for (let i = 1; i <= 5; i++) {

        const chave = dias[i];

        semanaHtml += criarDia(
          nomesDias[i],
          chave
        );
      }

      semanaElement.innerHTML = semanaHtml;


      /*
       * TABS
       */

      const tabs =
        document.querySelectorAll(".minhas-aulas-tab");

      const contents =
        document.querySelectorAll(".minhas-aulas-content");

      tabs.forEach(tab => {

        tab.addEventListener("click", () => {

          const destino = tab.dataset.tab;

          tabs.forEach(t =>
            t.classList.remove("active")
          );

          contents.forEach(content =>
            content.classList.remove("active")
          );

          tab.classList.add("active");

          document
            .getElementById(
              `minhas-aulas-${destino}`
            )
            .classList.add("active");

        });

      });

    })();
  </script>

</div>

<style>

  /* =========================
     TABS
     ========================= */

  .minhas-aulas .minhas-aulas-tabs {
    display: flex;
    gap: 0;
    margin: 0 0 1.5rem 0;
    padding: 0;

    border-bottom: 1px solid #e5e7eb;
  }

  .minhas-aulas .minhas-aulas-tab {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0.65rem 1.1rem;

    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;

    background: transparent;

    color: #6b7280;

    cursor: pointer;

    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;

    transition:
      color 0.15s ease,
      border-color 0.15s ease,
      background-color 0.15s ease;
  }

  .minhas-aulas .minhas-aulas-tab:hover {
    color: #2563eb;
    background: #f9fafb;
  }

  .minhas-aulas .minhas-aulas-tab.active {
    color: #2563eb;
    border-bottom-color: #2563eb;

    font-weight: 600;
  }


  /* =========================
     CONTEÚDO
     ========================= */

  .minhas-aulas .minhas-aulas-content {
    display: none;
  }

  .minhas-aulas .minhas-aulas-content.active {
    display: block;
  }


  /* =========================
     CABEÇALHO — HOJE
     ========================= */

  .minhas-aulas .minhas-aulas-cabecalho {
    margin: 0 0 1.5rem 0;
  }

  .minhas-aulas .minhas-aulas-data {
    margin: 0;

    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .minhas-aulas .minhas-aulas-data-completa {
    margin-top: 0.25rem;

    color: #6b7280;

    font-size: 0.9rem;
  }


  /* =========================
     DIA DA SEMANA
     ========================= */

  .minhas-aulas .minhas-aulas-dia {
    margin: 0 0 2rem 0;
  }

  .minhas-aulas .minhas-aulas-dia-titulo {
    margin: 0 0 0.75rem 0;

    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.4;
  }


  /* =========================
     LISTA DE AULAS
     ========================= */

  .minhas-aulas .minhas-aulas-lista {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;

    margin: 0;
    padding: 0;
  }


  /* =========================
     CARD DA AULA
     ========================= */

  .minhas-aulas .minha-aula {
    display: flex;
    align-items: stretch;

    width: 100%;
    box-sizing: border-box;

    overflow: hidden;

    margin: 0;
    padding: 0;

    border: 1px solid #e5e7eb;
    border-radius: 0.65rem;

    background: #ffffff;

    transition:
      border-color 0.15s ease,
      box-shadow 0.15s ease,
      transform 0.15s ease;
  }

  .minhas-aulas .minha-aula:hover {
    border-color: #93c5fd;

    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);

    transform: translateY(-1px);
  }


  /* =========================
     HORÁRIO
     ========================= */

  .minhas-aulas .minha-aula-horario {
    display: flex;
    align-items: center;

    flex: 0 0 125px;
    box-sizing: border-box;

    padding: 1rem;

    border-right: 1px solid #e5e7eb;

    background: #f9fafb;

    color: #374151;

    font-size: 0.95rem;
    font-weight: 700;

    font-variant-numeric: tabular-nums;
  }


  /* =========================
     INFORMAÇÕES
     ========================= */

  .minhas-aulas .minha-aula-info {
    flex: 1;
    min-width: 0;

    box-sizing: border-box;

    padding: 0.85rem 1rem;
  }

  .minhas-aulas .minha-aula-disciplina {
    margin: 0;

    color: inherit;

    font-size: 1rem;
    font-weight: 700;
    line-height: 1.35;
  }

  .minhas-aulas .minha-aula-sala {
    margin: 0.3rem 0 0 0;

    color: #6b7280;

    font-size: 0.875rem;
    line-height: 1.4;
  }


  /* =========================
     OBSERVAÇÃO / PROVA
     ========================= */

  .minhas-aulas .minha-aula-observacao {
    display: inline-block;

    margin: 0.5rem 0 0 0;
    padding: 0.2rem 0.5rem;

    border-radius: 0.3rem;

    background: #f3f4f6;

    color: #4b5563;

    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.3;
  }


  /* =========================
     SEM AULAS
     ========================= */

  .minhas-aulas .minhas-aulas-vazio {
    box-sizing: border-box;

    padding: 1.25rem;

    border: 1px dashed #d1d5db;
    border-radius: 0.65rem;

    color: #6b7280;

    text-align: center;
  }


  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 640px) {

    .minhas-aulas .minhas-aula-horario {
      flex: 0 0 105px;

      padding: 0.8rem;

      font-size: 0.85rem;
    }

    .minhas-aulas .minha-aula-info {
      padding: 0.8rem;
    }

    .minhas-aulas .minhas-aulas-tab {
      padding: 0.6rem 0.9rem;
    }

  }

</style>
